# Optional UI metadata for OpenAI hosts. Not required for the skill's behaviour.
# Lives in hosts/ rather than agents/: in Claude plugin format, agents/ means subagents.
author: "Sayandip Bagchi"
skills:
  - name: job-evaluator
    interface:
      display_name: "Job evaluator"
      short_description: "Score resumes against a JD with evidence and confidence"
      default_prompt: "Use $job-evaluator to score these resumes against this JD and recommend a shortlist."
    policy:
      allow_implicit_invocation: true
  - name: jd-to-rubric
    interface:
      display_name: "JD to rubric"
      short_description: "Turn a JD into a frozen, weighted screening rubric"
      default_prompt: "Use $jd-to-rubric to build the screening rubric for this JD."
    policy:
      allow_implicit_invocation: true
